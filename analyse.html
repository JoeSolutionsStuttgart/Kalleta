<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Analyse</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="broadsheet.css">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 80px; box-sizing: border-box; }
  .kicker { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--color-accent-700); }
  h1 { font-size: clamp(30px, 6vw, 44px); margin: 4px 0 6px; line-height: 1.05; }
  h2 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 12px; color: var(--color-neutral-700); font-weight: 600; }
  .leiste { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 18px 0 20px; }
  .seg button { font: inherit; font-size: 13px; padding: 7px 12px; background: transparent; border: 0; cursor: pointer; color: var(--color-text); }
  .seg button + button { border-left: 1px solid var(--color-divider); }
  .seg button[aria-pressed="true"] { background: var(--color-accent); color: var(--color-bg); }
  .kacheln { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .kachel { border: 1px solid var(--color-divider); border-radius: var(--radius-md, 4px); padding: 12px 14px; background: color-mix(in srgb, var(--color-surface, #fff) 70%, transparent); }
  .kachel .z { font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kachel .l { font-size: 12px; color: var(--color-neutral-700); margin-top: 2px; }
  .kachel .u { font-size: 12px; color: var(--color-accent-700); margin-top: 4px; }
  .karte { border: 1px solid var(--color-divider); border-radius: var(--radius-md, 4px); padding: 16px; margin-bottom: 14px; background: color-mix(in srgb, var(--color-surface, #fff) 70%, transparent); }
  .raster { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .raster .karte { margin: 0; }
  .zeile { display: grid; grid-template-columns: minmax(90px, 40%) 1fr auto; gap: 10px; align-items: center; font-size: 13.5px; padding: 3px 0; }
  .zeile .n { font-variant-numeric: tabular-nums; color: var(--color-neutral-700); min-width: 3ch; text-align: right; }
  .balken { height: 10px; background: var(--color-neutral-200, #e4e2e0); border-radius: 0 4px 4px 0; overflow: hidden; }
  .balken > i { display: block; height: 100%; background: var(--color-accent); border-radius: 0 4px 4px 0; }
  .leer { font-size: 13.5px; color: var(--color-neutral-700); }
  .hinweis { font-size: 13px; color: var(--color-neutral-700); line-height: 1.5; margin: 6px 0 0; }
  .fehler { padding: 14px 16px; border: 1px solid var(--color-divider); border-left: 4px solid var(--color-accent); margin: 20px 0; line-height: 1.5; }
  #diagramm { position: relative; }
  #diagramm svg { display: block; width: 100%; height: 220px; overflow: visible; }
  #tip { position: absolute; pointer-events: none; background: var(--color-text); color: var(--color-bg); font-size: 12.5px; padding: 6px 9px; border-radius: 4px; white-space: nowrap; transform: translate(-50%, -110%); display: none; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { padding: 4px 6px; border-bottom: 1px solid var(--color-divider); text-align: left; }
  td:last-child, th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  details summary { cursor: pointer; font-size: 13px; color: var(--color-accent-700); margin-top: 10px; }
  a { color: var(--color-accent-700); }
</style>
<script src="chronik-config.js"></script>
</head>
<body>
<div class="wrap">
  <a href="./" style="font-size: 14px; text-decoration: none;">← <span id="appname">Kalleta</span></a>
  <div class="kicker" style="margin-top: 16px;">Nur für den Inhaber</div>
  <h1>Analyse</h1>
  <div id="app"><p class="leer">Lädt …</p></div>
</div>
<script>
(function () {
  var CFG = window.CHRONIK_CONFIG || {};
  var NAME = String(CFG.appName || "Kalleta");
  document.getElementById("appname").textContent = NAME;
  document.title = "Analyse · " + NAME;
  var app = document.getElementById("app");
  var sb = null, tage = 30, metrik = "aufruf", daten = null;

  var NAMEN = {
    geraet: { mobil: "Handy", tablet: "Tablet", desktop: "Computer" },
    bereich: { app: "App", gast: "Gästeseite" },
    sprache: { de: "Deutsch", en: "Englisch" },
    dauer: { "0-1": "unter 1 Min.", "1-5": "1–5 Min.", "5-15": "5–15 Min.", "15-60": "15–60 Min.", "60plus": "über 1 Std." },
    offen: { bearbeiten_menue: "Bearbeiten-Menü", kontakte: "Kontakte", konto: "Konto", vergleich: "Vergleich", filter: "Filter", quiz: "Quiz",
      assistent: "Assistent", leitfaden: "Leitfaden", menue: "Menü", ueber_mich: "Über mich", kontakt_zeitleiste: "Zeitleiste eines Kontakts",
      ereignis_bearbeiten: "Ereignis bearbeiten", einstellungen: "Einstellungen", ereignis_ansehen: "Ereignis ansehen", fotoshow: "Fotoshow" },
    aktion: { registriert: "Registriert", anmeldung: "Anmeldung", ereignis_gespeichert: "Ereignis gespeichert", ereignis_geloescht: "Ereignis gelöscht",
      kommentar: "Kommentar", bild_hochgeladen: "Bild hochgeladen", gast_antwort: "Gast-Antwort", gast_bild: "Gast-Bild", kontakt_anfrage: "Kontaktanfrage",
      kontakt_antwort: "Kontaktanfrage beantwortet", gruppe: "Gruppe gespeichert", finanzen: "Finanzen", finanzen_abschluss: "Finanzen abgeschlossen",
      auslosung: "Geheime Auslosung", umfrage: "Umfrage", reaktion: "Reaktion", feedback: "Feedback", konto_geloescht: "Konto gelöscht",
      ki_plakat: "KI-Plakat gelesen", passwort_vergessen: "Passwort vergessen" },
    ansicht: { proportional: "Zeitstrahl (maßstäblich)", even: "Zeitstrahl (gleichmäßig)", vertikal: "Vertikal", kalender: "Kalender" },
    herkunft: { direkt: "Direkt / unbekannt" },
    browser: { chrome: "Chrome", safari: "Safari", firefox: "Firefox", edge: "Edge", opera: "Opera", andere: "Andere" },
    system: { ios: "iOS", android: "Android", windows: "Windows", macos: "macOS", linux: "Linux", andere: "Andere" }
  };
  var METRIKEN = [["aufruf", "Aufrufe"], ["besucher", "Besucher"], ["konten_neu", "Neue Konten"], ["ereignisse_neu", "Neue Ereignisse"]];

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function zahl(n) { return Number(n || 0).toLocaleString("de-DE"); }
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function kurz(s) { var p = s.split("-"); return p[2] + "." + p[1] + "."; }

  function sdk() {
    return new Promise(function (ok, no) {
      if (window.supabase) return ok();
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
      s.onload = ok; s.onerror = function () { no(new Error("SDK")); };
      document.head.appendChild(s);
    });
  }
  async function client() {
    if (sb) return sb;
    await sdk();
    var url = String(CFG.url || "").trim().replace(/\/+$/, "").replace(/\/(rest|auth|storage|realtime)\/v1.*$/i, "");
    if (!/^https?:\/\//.test(url)) url = "https://" + url;
    var key = String(CFG.anonKey || "").trim().replace(/^["']|["']$/g, "");
    /* Gleiche Anmeldung wie in der App (gleicher Browser-Speicher). */
    sb = window.supabase.createClient(url, key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
    return sb;
  }

  function fehler(t) { app.innerHTML = '<div class="fehler">' + t + "</div>"; }

  async function laden() {
    var c;
    try { c = await client(); } catch (e) { return fehler("Die Datenbank ist nicht erreichbar. Ist <code>chronik-config.js</code> ausgefüllt?"); }
    var s = await c.auth.getSession();
    if (!s.data || !s.data.session) return fehler('Bitte zuerst <a href="./">in ' + esc(NAME) + " anmelden</a> – mit dem Inhaber-Konto. Danach diese Seite neu laden.");
    var bis = new Date(), von = new Date(); von.setDate(von.getDate() - (tage - 1));
    var r = await c.rpc("nutzung_lesen", { p_von: iso(von), p_bis: iso(bis) });
    if (r.error) {
      var m = String(r.error.message || "");
      if (/N-01/.test(m)) return fehler("Diese Seite kann nur das Inhaber-Konto sehen.");
      if (/nutzung_lesen|function|schema cache/i.test(m)) return fehler("Die Statistik ist noch nicht eingerichtet: <strong>supabase-update-41.sql</strong> einmal im Supabase-SQL-Editor ausführen.");
      return fehler("Fehler beim Laden: " + esc(m));
    }
    daten = r.data || {};
    zeigen();
  }

  function auswerten() {
    var d = daten, summe = {}, proTag = {}, tageListe = [];
    var von = new Date(d.von + "T00:00:00"), bis = new Date(d.bis + "T00:00:00");
    for (var x = new Date(von); x <= bis; x.setDate(x.getDate() + 1)) { var k = iso(x); tageListe.push(k); proTag[k] = {}; }
    (d.zaehler || []).forEach(function (z) {
      var tag = z[0], k = z[1], n = Number(z[2] || 0);
      summe[k] = (summe[k] || 0) + n;
      if (proTag[tag]) proTag[tag][k] = (proTag[tag][k] || 0) + n;
    });
    (d.konten_neu || []).forEach(function (z) { if (proTag[z[0]]) proTag[z[0]].konten_neu = Number(z[1]); summe.konten_neu = (summe.konten_neu || 0) + Number(z[1]); });
    (d.ereignisse_neu || []).forEach(function (z) { if (proTag[z[0]]) proTag[z[0]].ereignisse_neu = Number(z[1]); summe.ereignisse_neu = (summe.ereignisse_neu || 0) + Number(z[1]); });
    return { summe: summe, proTag: proTag, tage: tageListe };
  }

  function gruppe(summe, pre) {
    var l = [];
    Object.keys(summe).forEach(function (k) { if (k.indexOf(pre + ":") === 0) l.push([k.slice(pre.length + 1), summe[k]]); });
    l.sort(function (a, b) { return b[1] - a[1]; });
    return l;
  }
  function liste(titel, summe, pre, max) {
    var l = gruppe(summe, pre), namen = NAMEN[pre] || {};
    var html = '<div class="karte"><h2>' + esc(titel) + "</h2>";
    if (!l.length) return html + '<p class="leer">Noch keine Daten.</p></div>';
    var top = l[0][1] || 1, ges = l.reduce(function (a, b) { return a + b[1]; }, 0);
    l.slice(0, max || 10).forEach(function (z) {
      var name = namen[z[0]] || z[0];
      html += '<div class="zeile" title="' + esc(name + ": " + zahl(z[1]) + " (" + Math.round(z[1] / ges * 100) + " %)") + '"><span>' + esc(name) + '</span><span class="balken"><i style="width:' + Math.max(2, z[1] / top * 100) + '%"></i></span><span class="n">' + zahl(z[1]) + "</span></div>";
    });
    if (l.length > (max || 10)) html += '<p class="hinweis">+ ' + (l.length - (max || 10)) + " weitere</p>";
    return html + "</div>";
  }

  function diagramm(a) {
    var werte = a.tage.map(function (t) { return [t, a.proTag[t][metrik] || 0]; });
    var max = Math.max(1, Math.max.apply(null, werte.map(function (w) { return w[1]; })));
    var W = Math.max(280, Math.round(app.clientWidth - 34)), H = 220, unten = 22, oben = 8, n = werte.length, sp = W / n, bw = Math.max(2, Math.min(28, sp - 2));
    var stufe = Math.pow(10, Math.floor(Math.log10(max))); var schritt = max / stufe > 5 ? stufe * 2 : stufe; if (max / schritt < 2) schritt = schritt / 2; schritt = Math.max(1, Math.round(schritt));
    var s = '<svg viewBox="0 0 ' + W + " " + H + '" style="height:' + H + 'px" role="img" aria-label="' + esc(METRIKEN.filter(function (m) { return m[0] === metrik; })[0][1]) + ' pro Tag">';
    for (var g = 0; g <= max; g += schritt) {
      var y = H - unten - (g / max) * (H - unten - oben);
      s += '<line x1="0" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="var(--color-divider)" stroke-width="1"/>';
      if (g > 0) s += '<text x="0" y="' + (y - 4) + '" font-size="11" fill="var(--color-neutral-700)" style="font-family:var(--font-body)">' + zahl(g) + "</text>";
    }
    werte.forEach(function (w, i) {
      var h = (w[1] / max) * (H - unten - oben), x = i * sp + (sp - bw) / 2, y = H - unten - h;
      if (w[1] > 0) s += '<path d="M' + x + "," + (H - unten) + "V" + (y + Math.min(4, h)) + "q0,-" + Math.min(4, h) + " " + Math.min(4, bw / 2) + ",-" + Math.min(4, h) + "H" + (x + bw - Math.min(4, bw / 2)) + "q" + Math.min(4, bw / 2) + ",0 " + Math.min(4, bw / 2) + "," + Math.min(4, h) + "V" + (H - unten) + 'Z" fill="var(--color-accent)"/>';
      s += '<rect data-i="' + i + '" x="' + i * sp + '" y="0" width="' + sp + '" height="' + (H - unten) + '" fill="transparent"/>';
    });
    var jede = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(W / 70))));
    werte.forEach(function (w, i) { if ((n - 1 - i) % jede === 0) s += '<text x="' + (i * sp + sp / 2) + '" y="' + (H - 5) + '" text-anchor="middle" font-size="12" fill="var(--color-neutral-700)" style="font-family:var(--font-body)">' + kurz(w[0]) + "</text>"; });
    s += "</svg>";
    return { svg: s, werte: werte, max: max, schritt: schritt };
  }

  function zeigen() {
    var a = auswerten(), S = a.summe, d = daten;
    var seg = '<div class="seg" role="group" aria-label="Zeitraum">' + [[7, "7 Tage"], [30, "30 Tage"], [90, "90 Tage"], [365, "1 Jahr"]].map(function (z) {
      return '<button data-tage="' + z[0] + '" aria-pressed="' + (z[0] === tage) + '">' + z[1] + "</button>"; }).join("") + "</div>";
    var kachel = function (z, l, u) { return '<div class="kachel"><div class="z">' + z + '</div><div class="l">' + esc(l) + "</div>" + (u ? '<div class="u">' + esc(u) + "</div>" : "") + "</div>"; };
    var dg = diagramm(a);
    var html = '<div class="leiste">' + seg + '<button class="btn btn-ghost" id="neu">Aktualisieren</button></div>' +
      '<div class="kacheln">' +
        kachel(zahl(S.aufruf), "Aufrufe") +
        kachel(zahl(S.besucher), "Besucher (pro Tag gezählt)") +
        kachel(zahl(S.besucher_neu), "Neue Besucher") +
        kachel(zahl(d.konten), "Konten gesamt", "+" + zahl(S.konten_neu) + " im Zeitraum") +
        kachel(zahl(d.ereignisse), "Ereignisse gesamt", "+" + zahl(S.ereignisse_neu) + " im Zeitraum") +
        kachel(zahl(d.aktiv_30), "Aktive Konten (30 Tage)") +
      "</div>" +
      '<div class="karte"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;"><h2 style="margin:0;">Pro Tag</h2>' +
        '<div class="seg" role="group" aria-label="Kennzahl">' + METRIKEN.map(function (m) { return '<button data-metrik="' + m[0] + '" aria-pressed="' + (m[0] === metrik) + '">' + m[1] + "</button>"; }).join("") + "</div></div>" +
        '<div id="diagramm">' + dg.svg + '<div id="tip"></div></div>' +
        '<details><summary>Als Tabelle</summary><table><tr><th>Tag</th><th>Wert</th></tr>' + dg.werte.slice().reverse().map(function (w) { return "<tr><td>" + kurz(w[0]) + w[0].slice(0, 4) + "</td><td>" + zahl(w[1]) + "</td></tr>"; }).join("") + "</table></details>" +
      "</div>" +
      '<div class="raster">' +
        liste("Genutzte Funktionen", S, "aktion", 12) +
        liste("Geöffnete Bereiche", S, "offen", 12) +
        liste("Geräte", S, "geraet") +
        liste("Nutzungsdauer", S, "dauer") +
        liste("Browser", S, "browser") +
        liste("Betriebssystem", S, "system") +
        liste("Herkunft", S, "herkunft", 10) +
        liste("Bereich", S, "bereich") +
        liste("Sprache", S, "sprache") +
        liste("Ansichten", S, "ansicht") +
        liste("Gewählte Designs", S, "design", 10) +
      "</div>" +
      '<p class="hinweis" style="margin-top:16px;">Gezählt werden nur Besuche von Menschen, die im Cookie-Fenster der Statistik zugestimmt haben. Konten und Ereignisse sind immer vollständig. ' +
      (S.installiert ? zahl(S.installiert) + " Aufrufe kamen aus der installierten App. " : "") + "</p>";
    app.innerHTML = html;
    app.querySelectorAll("[data-tage]").forEach(function (b) { b.onclick = function () { tage = Number(b.getAttribute("data-tage")); app.innerHTML = '<p class="leer">Lädt …</p>'; laden(); }; });
    app.querySelectorAll("[data-metrik]").forEach(function (b) { b.onclick = function () { metrik = b.getAttribute("data-metrik"); zeigen(); }; });
    document.getElementById("neu").onclick = function () { laden(); };
    var box = document.getElementById("diagramm"), tip = document.getElementById("tip");
    var titel = METRIKEN.filter(function (m) { return m[0] === metrik; })[0][1];
    box.addEventListener("mousemove", function (ev) {
      var r = ev.target.getAttribute && ev.target.getAttribute("data-i");
      if (r == null) { tip.style.display = "none"; return; }
      var w = dg.werte[Number(r)], rb = box.getBoundingClientRect();
      tip.innerHTML = "<strong>" + zahl(w[1]) + "</strong> " + esc(titel) + "<br>" + kurz(w[0]) + w[0].slice(0, 4);
      tip.style.display = "block"; tip.style.left = (ev.clientX - rb.left) + "px"; tip.style.top = (ev.clientY - rb.top) + "px";
    });
    box.addEventListener("mouseleave", function () { tip.style.display = "none"; });
  }

  var uhr = null;
  window.addEventListener("resize", function () { if (!daten) return; clearTimeout(uhr); uhr = setTimeout(zeigen, 150); });
  laden().catch(function (e) { fehler("Fehler: " + esc(e && e.message)); });
})();
</script>
</body>
</html>
